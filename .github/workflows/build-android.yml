name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare release files
        run: |
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/ComfyUI-Studio-debug.apk
          sha256sum releases/ComfyUI-Studio-debug.apk > releases/ComfyUI-Studio-debug.apk.sha256
          ls -lh releases

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComfyUI-Studio-debug-apk
          path: |
            releases/ComfyUI-Studio-debug.apk
            releases/ComfyUI-Studio-debug.apk.sha256
          if-no-files-found: error

      - name: Commit APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/ComfyUI-Studio-debug.apk releases/ComfyUI-Studio-debug.apk.sha256
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "chore: publish debug APK [skip ci]"
            git push origin HEAD:main
          fi
