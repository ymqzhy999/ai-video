name: Build iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload releases
          cp -R ios-build/Build/Products/Release-iphoneos/App.app package/Payload/App.app
          cd package
          ditto -c -k --sequesterRsrc --keepParent Payload ../releases/ComfyUI-Studio-unsigned.ipa
          cd ..
          shasum -a 256 releases/ComfyUI-Studio-unsigned.ipa > releases/ComfyUI-Studio-unsigned.ipa.sha256
          cat > releases/IOS-UNSIGNED-README.txt <<'TXT'
This IPA contains an unsigned iOS application built from the ComfyUI Workflow Studio source.

It CANNOT be installed directly with Apple Configurator or the App Store.
It must first be signed with your own Apple ID / provisioning profile using a tool such as
Xcode, Sideloadly, AltStore, or a paid Apple Developer account.

The repository's ios/ folder contains the complete Xcode project for signed builds.
TXT
          ls -lh releases

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComfyUI-Studio-unsigned-ipa
          path: |
            releases/ComfyUI-Studio-unsigned.ipa
            releases/ComfyUI-Studio-unsigned.ipa.sha256
            releases/IOS-UNSIGNED-README.txt
          if-no-files-found: error

      - name: Commit IPA to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/ComfyUI-Studio-unsigned.ipa releases/ComfyUI-Studio-unsigned.ipa.sha256 releases/IOS-UNSIGNED-README.txt
          if git diff --cached --quiet; then
            echo "IPA unchanged"
          else
            git commit -m "chore: publish unsigned iOS IPA [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
