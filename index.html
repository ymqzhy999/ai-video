<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#090b0e" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="ComfyUI Workflow Studio — 专业级可视化 AI 工作流编辑器" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ComfyUI Studio" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="./brand.svg" />
    <title>ComfyUI Workflow Studio</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="boot-mark">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M8 9.5h5.5a3 3 0 0 1 3 3v7a3 3 0 0 0 3 3H24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="7" cy="9.5" r="3" fill="currentColor"/>
            <circle cx="25" cy="22.5" r="3" fill="currentColor"/>
            <circle cx="16" cy="16" r="2.2" fill="currentColor" opacity=".65"/>
          </svg>
        </div>
        <p>COMFYUI STUDIO</p>
        <span>正在载入工作流实验室…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      html,body{margin:0;background:#090b0e;color:#e9ecf2}
      .boot-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;background:radial-gradient(ellipse at 50% 40%,#131720 0%,#090b0e 62%)}
      .boot-mark{width:58px;height:58px;border:1px solid #2a2e39;border-radius:15px;display:grid;place-items:center;color:#8b7dff;background:#11141a;box-shadow:0 18px 50px rgba(0,0,0,.45)}
      .boot-mark svg{width:32px;height:32px}
      .boot-screen p{font-size:11px;letter-spacing:.2em;color:#9ca5b5;margin:6px 0 0;font-weight:600}
      .boot-screen span{font-size:11px;color:#58606f}
    </style>
  </body>
</html>
